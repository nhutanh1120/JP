<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Luu moments</title>
        <link rel="icon" href="/assets/img/logo.png" />
        <link href="https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="./../assets/css/grid.css" />
        <link rel="stylesheet" href="./../assets/css/theme.css" />
        <link rel="stylesheet" href="./../assets/css/style.css" />
        <link rel="stylesheet" href="./../assets/css/class.css" />
        <link rel="stylesheet" href="./../assets/css/arrange.css" />
        <link rel="stylesheet" href="./../assets/css/clock.css" />
    </head>

    <body>
        <!-- Loader -->
        <div id="loader">
            <span></span>
        </div>

        <div class="app">
            <div class="sidebar open">
                <div class="sidebar-logo">
                    <i class="bx bxs-heart-circle icon"></i>
                    <span class="logo-name">Luu Moments</span>
                    <i class="bx bx-menu-alt-right" id="btn-close"></i>
                </div>
                <div class="sidebar-body"></div>
                <div class="sidebar-footer">
                    <div class="clock-footer" id="clock-footer"></div>
                </div>
            </div>
            <div class="content">
                <section class="content-section">
                    <div class="section-left">
                        <lord-icon
                            src="./../json/icon/accessibility.json"
                            trigger="loop"
                            style="width: 50px; height: 50px"
                        >
                        </lord-icon>
                    </div>
                    <div class="section-search">
                        <div class="section-search-input">
                            <input type="text" placeholder="Tìm kiếm..." value="" />
                            <i id="close-search" class="bx bx-search"></i>
                        </div>
                        <div class="search-result"></div>
                    </div>
                    <div class="section-right">
                        <lord-icon
                            src="./../json/icon/accessibility.json"
                            trigger="loop"
                            style="width: 50px; height: 50px"
                        >
                        </lord-icon>
                    </div>
                    <div class="clock">
                        <div class="hour" id="hour"></div>
                        <div class="minute" id="minute"></div>
                        <div class="second" id="second"></div>
                    </div>
                </section>

                <main>
                    <div id="dropp" class="dropp"></div>
                    <div class="dragg"></div>
                </main>

                <footer class="footer">
                    <p class="text-center">Copyright &copy;&nbsp;Lưu Trần Anh Nhựt</p>
                </footer>
            </div>
        </div>

        <div class="selector">
            <div class="selector-title">
                <lord-icon src="./../json/icon/selector.json" trigger="loop" style="width: 40px; height: 40px">
                </lord-icon>
                <span>Chọn</span>
            </div>
            <div class="selector-item">
                <span class="border-animation" data-type="hiragana">
                    <button>hiragana</button>
                </span>
                <span class="border-animation" data-type="katakana">
                    <button>katakana</button>
                </span>
                <span class="border-animation" data-type="kanji">
                    <button>kanji</button>
                </span>
                <span class="border-animation active" data-type="transfiguration">
                    <button>biến âm</button>
                </span>
                <span class="border-animation" data-type="ligatures">
                    <button>âm ghép</button>
                </span>
            </div>
        </div>

        <!-- hand up -->
        <div id="hand-up">
            <a href="#dropp" title="hand-up">
                <i class="bx bxs-hand-up bx-sm"></i>
            </a>
        </div>

        <!-- setting -->
        <div class="setting">
            <div class="setting-icon">
                <i class="bx bx-cog bx-sm"></i>
                <span>Cài đặt</span>
            </div>
            <menu class="setting-items-menu">
                <span class="menu-item" onclick="location.href = '/'">
                    <lord-icon src="./../json/icon/home.json" trigger="hover" style="width: 22px; height: 22px">
                    </lord-icon>
                </span>
                <span class="menu-item" onclick="location.href = './vocabulary.html'">
                    <lord-icon src="./../json/icon/book.json" trigger="hover" style="width: 22px; height: 22px">
                    </lord-icon>
                </span>
                <span class="menu-item" id="slidebar">
                    <lord-icon src="./../json/icon/slidebar.json" trigger="hover" style="width: 22px; height: 22px">
                    </lord-icon>
                </span>
                <span class="menu-item">
                    <lord-icon src="./../json/icon/heart.json" trigger="hover" style="width: 22px; height: 22px">
                    </lord-icon>
                </span>
            </menu>
        </div>
        <script src="./../vendor/jquery/jquery-3.6.0.min.js"></script>
        <script src="./../vendor/jquery-ui/jquery-ui.js"></script>
        <script src="./../vendor/lordicon/lordicon.js"></script>
        <script src="./../assets/scripts/arrange.js"></script>
        <script src="./../assets/scripts/utils.js"></script>
        <script src="./../assets/scripts/script.js"></script>
        <script src="./../assets/scripts/setting.js"></script>
    </body>
</html>
