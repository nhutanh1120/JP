<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Luu moments</title>
        <link rel="icon" href="/assets/img/logo.png" />
        <link href="https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="./../assets/css/grid.css" />
        <link rel="stylesheet" href="./../assets/css/theme.css" />
        <link rel="stylesheet" href="./../assets/css/style.css" />
        <link rel="stylesheet" href="./../assets/css/class.css" />
        <link rel="stylesheet" href="./../assets/css/message.css" />
        <link rel="stylesheet" href="./../assets/css/vocabulary.css" />
        <link rel="stylesheet" href="./../assets/css/clock.css" />
        <script src="./../assets/scripts/redirect.js"></script>
    </head>

    <body>
        <!-- Loader -->
        <div id="loader">
            <span></span>
        </div>

        <div class="app">
            <div class="sidebar open">
                <div class="sidebar-logo">
                    <i class="bx bxs-heart-circle icon"></i>
                    <span class="logo-name">Luu Moments</span>
                    <i class="bx bx-menu-alt-right" id="btn-close"></i>
                </div>
                <div class="sidebar-body"></div>
                <div class="sidebar-footer">
                    <div class="clock-footer" id="clock-footer"></div>
                </div>
            </div>
            <div class="content">
                <section class="content-section">
                    <div class="section-left">
                        <lord-icon
                            src="./../json/icon/accessibility.json"
                            trigger="loop"
                            style="width: 50px; height: 50px"
                        >
                        </lord-icon>
                    </div>
                    <div class="section-search">
                        <div class="section-search-input">
                            <input type="text" placeholder="Tìm kiếm..." value="" />
                            <i id="close-search" class="bx bx-search"></i>
                        </div>
                        <div class="search-result"></div>
                    </div>
                    <div class="section-right">
                        <lord-icon
                            src="./../json/icon/accessibility.json"
                            trigger="loop"
                            style="width: 50px; height: 50px"
                        >
                        </lord-icon>
                    </div>
                    <div class="clock">
                        <div class="hour" id="hour"></div>
                        <div class="minute" id="minute"></div>
                        <div class="second" id="second"></div>
                    </div>
                </section>
                <main>
                    <article class="article-left">
                        <div class="main-title">
                            <h5>Từ vựng</h5>
                        </div>
                        <div class="vocabulary">
                            <div class="option">
                                <span class="group">
                                    <select name="topic" id="topic"></select>
                                    <button id="type">a</button>
                                </span>
                                <h5 id="vocabulary-text"></h5>
                                <span class="group">
                                    <button id="result">
                                        <lord-icon
                                            src="./../json/icon/next.json"
                                            trigger="hover"
                                            style="width: 20px; height: 20px"
                                        >
                                        </lord-icon>
                                    </button>
                                    <button id="view-result">
                                        <lord-icon
                                            src="./../json/icon/result.json"
                                            trigger="hover"
                                            style="width: 20px; height: 20px"
                                        >
                                        </lord-icon>
                                    </button>
                                </span>
                            </div>
                            <div class="group-vocabulary">
                                <div class="input-vocabulary">
                                    <input type="text" id="vocabulary-input" placeholder="あいうえお。。。" />
                                </div>
                            </div>
                            <div class="vocabulary-result-view"></div>
                        </div>
                    </article>
                    <article class="article-right">
                        <div class="list-vocabulary">
                            <div class="list-vocabulary-title">Danh sách</div>
                            <div class="list-vocabulary-content" style="display: none">
                                <select name="list-vocabulary-option" id="list-vocabulary-option"></select>
                                <ul></ul>
                            </div>
                        </div>
                    </article>
                </main>
                <footer class="footer">
                    <p class="text-center">Copyright &copy;&nbsp;Lưu Trần Anh Nhựt</p>
                </footer>
            </div>
        </div>

        <!-- message -->
        <div id="toast"></div>

        <!-- setting -->
        <div class="setting">
            <div class="setting-icon">
                <i class="bx bx-cog bx-sm"></i>
                <span>Cài đặt</span>
            </div>
            <menu class="setting-items-menu">
                <span class="menu-item" onclick="location.href = '/'">
                    <lord-icon src="./../json/icon/home.json" trigger="hover" style="width: 22px; height: 22px">
                    </lord-icon>
                </span>
                <span class="menu-item">
                    <lord-icon src="./../json/icon/book.json" trigger="hover" style="width: 22px; height: 22px">
                    </lord-icon>
                </span>
                <span class="menu-item" id="slidebar">
                    <lord-icon src="./../json/icon/slidebar.json" trigger="hover" style="width: 22px; height: 22px">
                    </lord-icon>
                </span>
                <span class="menu-item" onclick="location.href = './arrange.html'">
                    <lord-icon src="./../json/icon/heart.json" trigger="hover" style="width: 22px; height: 22px">
                    </lord-icon>
                </span>
            </menu>
        </div>

        <script src="./../vendor/jquery/jquery-3.6.0.min.js"></script>
        <script src="./../vendor/jquery-ui/jquery-ui.js"></script>
        <script src="./../vendor/lordicon/lordicon.js"></script>
        <script src="./../assets/scripts/message.js"></script>
        <script src="./../assets/scripts/utils.js"></script>
        <script src="./../assets/scripts/vocabulary.js"></script>
        <script src="./../assets/scripts/script.js"></script>
        <script src="./../assets/scripts/setting.js"></script>
    </body>
</html>
