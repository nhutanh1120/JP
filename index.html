<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Luu moments</title>
        <link rel="icon" href="./assets/img/logo.png" />
        <link href="https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="./assets/css/grid.css" />
        <link rel="stylesheet" href="./assets/css/theme.css" />
        <link rel="stylesheet" href="./assets/css/style.css" />
        <link rel="stylesheet" href="./assets/css/class.css" />
        <link rel="stylesheet" href="./assets/css/index.css" />
        <link rel="stylesheet" href="./assets/css/pain.css" />
        <link rel="stylesheet" href="./assets/css/clock.css" />
    </head>

    <body>
        <!-- Loader -->
        <div id="loader">
            <span></span>
        </div>

        <div class="app">
            <div class="sidebar open">
                <div class="sidebar-logo">
                    <i class="bx bxs-heart-circle icon"></i>
                    <span class="logo-name">Luu Moments</span>
                    <i class="bx bx-menu-alt-right" id="btn-close"></i>
                </div>
                <div class="sidebar-body"></div>
                <div class="sidebar-footer">
                    <div class="clock-footer" id="clock-footer"></div>
                </div>
            </div>
            <div class="content">
                <section class="content-section">
                    <div class="section-left">
                        <lord-icon
                            src="./../json/icon/accessibility.json"
                            trigger="loop"
                            style="width: 50px; height: 50px"
                        >
                        </lord-icon>
                    </div>
                    <div class="section-search">
                        <div class="section-search-input">
                            <input type="text" placeholder="Tìm kiếm..." value="" />
                            <i id="close-search" class="bx bx-search"></i>
                        </div>
                        <div class="search-result"></div>
                    </div>
                    <div class="section-right">
                        <lord-icon
                            src="./../json/icon/accessibility.json"
                            trigger="loop"
                            style="width: 50px; height: 50px"
                        >
                        </lord-icon>
                    </div>
                    <div class="clock">
                        <div class="hour" id="hour"></div>
                        <div class="minute" id="minute"></div>
                        <div class="second" id="second"></div>
                    </div>
                </section>
                <div class="filter">
                    <h5>Bảng chữ cái</h5>
                    <div class="option">
                        <select name="type_character" id="type_character">
                            <option value="all">Tất cả</option>
                            <option value="hiragana" selected>Hiragana</option>
                            <option value="katakana">Katakana</option>
                            <option value="kanji">Kanji</option>
                            <option value="transfiguration">Biến âm</option>
                            <option value="ligatures">Âm ghép</option>
                        </select>
                        <span>
                            <button id="click">
                                <lord-icon
                                    src="./json/icon/next.json"
                                    trigger="hover"
                                    style="width: 20px; height: 20px"
                                >
                                </lord-icon>
                            </button>
                            <button id="result">
                                <lord-icon
                                    src="./json/icon/result.json"
                                    trigger="hover"
                                    style="width: 20px; height: 20px"
                                >
                                </lord-icon>
                            </button>
                        </span>
                        <audio id="audio" controls>
                            <source src="./audio/a.mp3" type="audio/mp3" />
                        </audio>
                    </div>
                    <p id="text" class="text_show"></p>
                </div>

                <!-- pain width canvas -->
                <main>
                    <div class="left-block">
                        <div class="colors">
                            <button type="button" value="#0000ff"></button>
                            <button type="button" value="#009fff"></button>
                            <button type="button" value="#0fffff"></button>
                            <button type="button" value="#bfffff"></button>
                            <button type="button" value="#000000"></button>
                            <button type="button" value="#333333"></button>
                            <button type="button" value="#666666"></button>
                            <button type="button" value="#999999"></button>
                            <button type="button" value="#ffcc66"></button>
                            <button type="button" value="#ffcc00"></button>
                            <button type="button" value="#ffff00"></button>
                            <button type="button" value="#ffff99"></button>
                            <button type="button" value="#003300"></button>
                            <button type="button" value="#555000"></button>
                            <button type="button" value="#00ff00"></button>
                            <button type="button" value="#99ff99"></button>
                            <button type="button" value="#f00000"></button>
                            <button type="button" value="#ff6600"></button>
                            <button type="button" value="#ff9933"></button>
                            <button type="button" value="#f5deb3"></button>
                            <button type="button" value="#330000"></button>
                            <button type="button" value="#663300"></button>
                            <button type="button" value="#cc6600"></button>
                            <button type="button" value="#deb887"></button>
                            <button type="button" value="#aa0fff"></button>
                            <button type="button" value="#cc66cc"></button>
                            <button type="button" value="#ff66ff"></button>
                            <button type="button" value="#ff99ff"></button>
                            <button type="button" value="#e8c4e8"></button>
                            <button type="button" value="#ffffff"></button>
                        </div>
                        <div class="brushes">
                            <button type="button" value="1"></button>
                            <button type="button" value="2"></button>
                            <button type="button" value="3"></button>
                            <button type="button" value="4"></button>
                            <button type="button" value="5"></button>
                        </div>
                        <div class="buttons">
                            <button id="clear" type="button">Xóa</button>
                            <button id="save" type="button">Lưu</button>
                        </div>
                    </div>
                    <div class="right-block">
                        <canvas id="paint-canvas" width="840" height="400"></canvas>
                    </div>
                </main>

                <footer class="footer">
                    <p class="text-center">Copyright &copy;&nbsp;Lưu Trần Anh Nhựt</p>
                </footer>
            </div>
        </div>

        <div class="setting">
            <div class="setting-icon">
                <i class="bx bx-cog bx-sm"></i>
                <span>Cài đặt</span>
            </div>
            <menu class="setting-items-menu">
                <span class="menu-item">
                    <lord-icon src="./json/icon/home.json" trigger="hover" style="width: 22px; height: 22px">
                    </lord-icon>
                </span>
                <span class="menu-item" onclick="location.href = 'pages/vocabulary.html'">
                    <lord-icon src="./json/icon/book.json" trigger="hover" style="width: 22px; height: 22px">
                    </lord-icon>
                </span>
                <span class="menu-item" id="slidebar">
                    <lord-icon src="./json/icon/slidebar.json" trigger="hover" style="width: 22px; height: 22px">
                    </lord-icon>
                </span>
                <span class="menu-item" onclick="location.href = 'pages/arrange.html'">
                    <lord-icon src="./json/icon/heart.json" trigger="hover" style="width: 22px; height: 22px">
                    </lord-icon>
                </span>
            </menu>
        </div>

        <script src="./assets/scripts/redirect.js"></script>
        <script src="./vendor/lordicon/lordicon.js"></script>
        <script src="./vendor/jquery/jquery-3.6.0.min.js"></script>
        <script src="./assets/scripts/pain.js"></script>
        <script src="./assets/scripts/utils.js"></script>
        <script src="./assets/scripts/script.js"></script>
        <script src="./assets/scripts/setting.js"></script>
        <script src="./assets/scripts/index.js"></script>
    </body>
</html>
